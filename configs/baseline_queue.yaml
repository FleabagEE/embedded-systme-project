# Seven distinct presets. Shared settings reproduce the supplied baseline image.
sequence_start: 7
defaults:
  model.pooling: max
  model.expansion_ratio: 3
  model.standard_stem: true
  model.width: all
  model.width_options: ['1', '5', '25']
  model.mobile_spatial_conv: DW
  all_width_training.strategy: all
  all_width_training.sandwich_random_widths: 1
  training.duration_secs: [1.0, 2.0]
  training.seed: 42
  training.epochs: 50
  training.batch_size: 64
  validation.method: fixed
  validation.stride_seconds: 0.5
  validation.aggregation: mean_probability
  evaluation.num_crops: 3
  quantization.bn_recalibration_samples: 0
  quantization.output_duration_secs: []
  quantization.formats: [fp32, int8]
  runtime.device: auto
  runtime.deterministic: true
  augmentation.enabled: true
  augmentation.spectrogram.FrequencyMask.enabled: true
experiments:
  - name: dscnn_sc_mel128_fmask8
    overrides:
      model.architecture: dscnn
      model.conv_type: SC
      audio.n_mels: 128
      augmentation.spectrogram.FrequencyMask.max_bins: 8
  - name: dscnn_dw_mel64_fmask4
    overrides:
      model.architecture: dscnn
      model.conv_type: DW
      audio.n_mels: 64
      augmentation.spectrogram.FrequencyMask.max_bins: 4
  - name: dscnn_dw_mel128_fmask8
    overrides:
      model.architecture: dscnn
      model.conv_type: DW
      audio.n_mels: 128
      augmentation.spectrogram.FrequencyMask.max_bins: 8
  - name: mobilenetv2_sc_mel64_fmask4
    overrides:
      model.architecture: mobilenetv2
      model.conv_type: SC
      model.mobile_spatial_conv: SC
      audio.n_mels: 64
      augmentation.spectrogram.FrequencyMask.max_bins: 4
  - name: mobilenetv2_sc_mel128_fmask8
    overrides:
      model.architecture: mobilenetv2
      model.conv_type: SC
      model.mobile_spatial_conv: SC
      audio.n_mels: 128
      augmentation.spectrogram.FrequencyMask.max_bins: 8
  - name: mobilenetv2_dw_mel64_fmask4
    overrides:
      model.architecture: mobilenetv2
      model.conv_type: DW
      model.mobile_spatial_conv: DW
      audio.n_mels: 64
      augmentation.spectrogram.FrequencyMask.max_bins: 4
  - name: mobilenetv2_dw_mel128_fmask8
    overrides:
      model.architecture: mobilenetv2
      model.conv_type: DW
      model.mobile_spatial_conv: DW
      audio.n_mels: 128
      augmentation.spectrogram.FrequencyMask.max_bins: 8
