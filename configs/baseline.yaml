dataset:
  root: /Users/colin/sound_datasets/urbansound8k
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]
  cache_dir: features/waveforms
audio:
  sample_rate: 16000
  duration_sec: 1.0 #
  n_mels: 64 #
  frame_length_ms: 25
  hop_length_ms: 10
  fft_length: 512
  log_offset: 0.000001
  spectrum: power
  mono: mean
  normalization: none
  padding: center
  center: false
augmentation:
  enabled: true
  speed_probability: 0.50
  speed_min: 0.9
  speed_max: 1.1
  gain_probability: 0.80
  gain_db_min: -6.0
  gain_db_max: 6.0
model:
  conv_type: SC #
  standard_stem: true
  width: 'all' #
  num_blocks: 4
  base_channels: [32, 64, 128, 128]
  kernel_size: 3
  global_average_pooling: true
  num_classes: 10
training:
  duration_secs: [1, 2]
  epochs: 50
  batch_size: 32
  optimizer: adam
  learning_rate: 0.001
  seed: 42
  early_stopping_patience: 8
  monitor: val_accuracy
  lr_patience: 3
  lr_factor: 0.5
  min_learning_rate: 0.00001
evaluation:
  num_crops: 3
all_width_training:
  loss_weights: [1.0, 1.0, 1.0]
  shared_weights: true
  width_order: ['1', '5', '25']
quantization:
  representative_samples: 128
  int8_in_and_out: true
  output_duration_secs: [1, 2]
runtime:
  device: cpu
  deterministic: true
  output_dir: models
